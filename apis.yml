name: Mint State Labs
description: >-
  Mint State Labs (mintstatelabs.com, operating as Wildnet Edge) is an AI-first
  custom software development and IT outsourcing company delivering custom AI,
  machine learning, mobile, web, and cloud engineering services to enterprises
  and Fortune 500 clients. Its offerings span custom AI model and agent
  development, generative AI, ChatGPT app development, mobile and web app
  development, DevOps, data engineering, business intelligence, and staff
  augmentation ("build a team" / white-label) across a broad set of frameworks
  and platforms. It was surfaced as a Techstars portfolio company and added to
  the API Evangelist network as a lead; the public presence is a marketing and
  services site with no first-party API product, developer portal, OpenAPI, or
  SDK surface at the time of enrichment.
